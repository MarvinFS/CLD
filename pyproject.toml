[project]
name = "claudecli-dictate"
version = "0.9.1"
description = "ClaudeCli-Dictate (CLD) - Windows GUI speech-to-text with Whisper + Nemotron engines, overlay UI and system tray integration"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Matches LICENSE (GNU GPL v3) and the README license section. Was previously
# mislabelled "MIT" - reconciled to the actual project license.
license = "GPL-3.0-or-later"
authors = [
    { name = "MarvinFS" }
]
keywords = ["whisper", "nemotron", "onnxruntime", "speech-to-text", "stt", "voice", "dictation", "windows", "gui", "pywhispercpp"]

dependencies = [
    "sounddevice>=0.4",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "numpy>=1.24",
    "keyboard>=0.13",
    # Exact pin: cld.ui.tray reaches into pystray Icon internals (_hwnd,
    # _menu_hwnd, _thread) to force-remove ghost tray icons after sleep,
    # which is private API. Auto-upgrading pystray could rename or remove
    # those attributes and silently break ghost-icon cleanup.
    "pystray==0.19.5",
    "pillow>=9.0",
    "pywhispercpp>=1.5",
    # Exact pin: (1) CLD.spec excludes onnxruntime's native files from UPX by
    # exact filename; (2) onnxruntime 1.30.0-1.32.0 CPU kernel changes regress
    # Nemotron int8 outputs (drops closing "." on de.wav / fails test_nemotron,
    # degrades es.wav "hacer tu" -> "hacerte"). Re-verify test_nemotron before bumping.
    "onnxruntime==1.29.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.17.6", "pyinstaller>=6.0"]

[project.scripts]
cld = "cld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cld"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Preserve pre-0.16 default rule set after upgrading to ruff 0.17.x
# (ruff 0.16 expanded defaults from 59 to 413 rules).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# cli.py has intentional late imports (after early debug check)
"src/cld/cli.py" = ["E402"]
