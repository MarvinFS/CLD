[project]
name = "claudecli-dictate"
version = "0.8.2"
description = "ClaudeCli-Dictate (CLD) - Windows GUI speech-to-text with Whisper + Nemotron engines, overlay UI and system tray integration"
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Matches LICENSE (GNU GPL v3) and the README license section. Was previously
# mislabelled "MIT" - reconciled to the actual project license.
license = "GPL-3.0-or-later"
authors = [
    { name = "MarvinFS" }
]
keywords = ["whisper", "nemotron", "sherpa-onnx", "speech-to-text", "stt", "voice", "dictation", "windows", "gui", "pywhispercpp"]

dependencies = [
    "sounddevice>=0.4",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "numpy>=1.24",
    "keyboard>=0.13",
    # Exact pin: cld.ui.tray reaches into pystray Icon internals (_hwnd,
    # _menu_hwnd, _thread) to force-remove ghost tray icons after sleep,
    # which is private API. Auto-upgrading pystray could rename or remove
    # those attributes and silently break ghost-icon cleanup.
    "pystray==0.19.5",
    "pillow>=9.0",
    "pywhispercpp>=1.4",
    # Exact pin: the Nemotron engine targets the sherpa-onnx 1.13.3 Python API
    # (OnlineRecognizer.from_transducer field names + stream.set_option) and a
    # specific CPU-only onnxruntime layout the PyInstaller spec excludes from
    # UPX by exact filename. A minor bump could rename the bundled native files.
    "sherpa-onnx==1.13.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller>=6.0"]

[project.scripts]
cld = "cld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cld"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# cli.py has intentional late imports (after early debug check)
"src/cld/cli.py" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]
